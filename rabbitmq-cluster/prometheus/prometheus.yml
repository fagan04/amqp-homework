global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Aggregated node-level metrics (cheap; used for health and global rates)
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbit1:15692
          - rabbit2:15692
          - rabbit3:15692

  # Per-object metrics (per-queue depth, per-queue Raft state)
  - job_name: rabbitmq-per-object
    metrics_path: /metrics/per-object
    scrape_interval: 15s
    static_configs:
      - targets:
          - rabbit1:15692
          - rabbit2:15692
          - rabbit3:15692
