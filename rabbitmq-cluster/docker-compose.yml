x-rabbitmq: &rabbitmq
  image: rabbitmq:4.1-management   # pinned for reproducibility
  command: >
    sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec rabbitmq-server"
  networks:
    - rabbitnet
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 10

services:
  rabbit1:
    <<: *rabbitmq
    container_name: rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: ${ERLANG_COOKIE}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  rabbit2:
    <<: *rabbitmq
    container_name: rabbit2
    hostname: rabbit2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit2
      RABBITMQ_ERLANG_COOKIE: ${ERLANG_COOKIE}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbit1:
        condition: service_healthy

  rabbit3:
    <<: *rabbitmq
    container_name: rabbit3
    hostname: rabbit3
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit3
      RABBITMQ_ERLANG_COOKIE: ${ERLANG_COOKIE}
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - rabbit3_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbit2:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - rabbitnet
    depends_on:
      rabbit3:
        condition: service_healthy

  # One-shot job: waits for the 3-node cluster and applies operator policies.
  rabbit-init:
    image: rabbitmq:4.1-management
    container_name: rabbit-init
    hostname: rabbit-init
    environment:
      ERLANG_COOKIE: ${ERLANG_COOKIE}
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./init:/init:ro
    networks:
      - rabbitnet
    restart: "no"
    depends_on:
      rabbit3:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rabbitmq-hw2.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - rabbitnet
    depends_on:
      - prometheus

networks:
  rabbitnet:
    driver: bridge

volumes:
  rabbit1_data:
  rabbit2_data:
  rabbit3_data:
  prometheus_data:
  grafana_data:
