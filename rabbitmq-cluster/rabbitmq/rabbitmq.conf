default_user = admin
default_pass = admin

cluster_formation.peer_discovery_backend = classic_config

cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit3

cluster_partition_handling = pause_minority

# Inter-node failure detection. Default is 60 s, meaning a silent network
# partition (dropped packets, no TCP reset) is only noticed after 45-75 s and
# pause_minority triggers that late. 15 s (detection in ~11-19 s) is a common
# setting for a LAN / single-host cluster; lower values risk false positives.
net_ticktime = 15

default_queue_type = quorum

prometheus.tcp.port = 15692
